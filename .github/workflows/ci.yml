# GitHub-hosted runners only: this repository is public, and a fork's pull request must never run on a
# self-hosted runner.
name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      # Consumers install dist/ straight from git, so it must match a fresh build of src/.
      - run: bun run check:dist
      - run: bun run test
      - run: bun run lint
      - run: bun run format:check
